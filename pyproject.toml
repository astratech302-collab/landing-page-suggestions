[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "landing-page-suggestions"
version = "0.1.0"
description = "Conversion suggestions per landing page from Google Ads report + Clarity + brand guidelines"
requires-python = ">=3.12"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
lp-suggest = "suggest:main"

[tool.setuptools]
py-modules = ["suggest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
